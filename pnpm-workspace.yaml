packages:
  - apps/*
  - packages/*

# Refuse to install with a Node.js or pnpm version outside the "engines" ranges.
engineStrict: true

# Dependencies allowed to run install scripts. Everything else is blocked by pnpm.
allowBuilds:
  # Vite 7 bundles esbuild; its postinstall verifies the platform binary.
  esbuild: true

# Packages hoisted into node_modules/.pnpm/node_modules (pnpm default: everything).
# punycode is excluded: ESLint pulls it in (ajv -> uri-js), and once hoisted it shadows
# the built-in "punycode" module typed by @types/node, so tsc type-checks its JS source.
hoistPattern:
  - '*'
  - '!punycode'
