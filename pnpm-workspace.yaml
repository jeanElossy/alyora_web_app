packages:
  - apps/*
  - packages/*

# Refuse l'installation avec une version de Node.js ou de pnpm hors des plages "engines".
engineStrict: true

# Dépendances autorisées à exécuter un script d'installation. pnpm bloque toutes les autres.
allowBuilds:
  # Vite 7 embarque esbuild ; son postinstall vérifie le binaire de la plateforme.
  esbuild: true
  # Refusé explicitement : son postinstall télécharge un binaire MongoDB. Le binaire est
  # téléchargé au premier lancement des tests à la place (et mis en cache en CI).
  mongodb-memory-server: false

# Paquets remontés dans node_modules/.pnpm/node_modules (par défaut pour pnpm : tous).
# punycode est exclu : ESLint l'installe (ajv -> uri-js) et, une fois remonté, il masque le
# module intégré "punycode" typé par @types/node, si bien que tsc vérifie sa source JS.
hoistPattern:
  - '*'
  - '!punycode'
